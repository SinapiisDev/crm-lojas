name: Manter Supabase acordado

# O Supabase grátis pausa o projeto após 7 dias sem uso. Uma leitura por dia evita isso.
# Atenção: o GitHub desliga agendamentos de repositórios sem atividade há 60 dias (reativar em Actions).
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/saude
        env:
          SITE: ${{ vars.SITE_URL }}
          SEGREDO: ${{ secrets.AVISOS_SEGREDO }}
        run: |
          if [ -z "$SITE" ] || [ -z "$SEGREDO" ]; then echo "Defina a variável SITE_URL e o secret AVISOS_SEGREDO no repositório."; exit 1; fi
          curl -fsS -H "Authorization: Bearer $SEGREDO" "$SITE/api/saude"
