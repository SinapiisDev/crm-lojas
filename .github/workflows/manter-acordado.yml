name: Manter Supabase acordado

# O Supabase grátis pausa o projeto após 7 dias sem uso. Uma leitura por dia evita isso.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/saude
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE" ]; then echo "Defina a variável SITE_URL no repositório."; exit 0; fi
          curl -fsS "$SITE/api/saude"
